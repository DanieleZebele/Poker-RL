
[fleet]
worker_ceiling = 3
device = "cpu"      # "auto": the GPU if torch sees one, else "cpu"; or "cpu" / "cuda" to force it
update_device = "auto"   # where the PPO update and the critic run: "same" as device; "auto" = the GPU if the machine has one, else as device; or "cpu" / "cuda". The hands are always played on device
collect_workers = 30  # forked copies of each worker that play its iteration's hands at the same time (~120 MB each while they run); 1 = none. cpu only
session_workers = 30   # the same for the sessions of a rated pass: the validation, the pass against the anchors, the Elo passes. cpu only

[elo]
k_schedule = "0:16, 20:11, 45:7.4, 80:5, 140:3.4, 225:2.3, 325:1.6, 500:1.05, 750:0.72, 1200:0.49, 1700:0.33, 2500:0.22, 3750:0.15, 5500:0.1, 8500:0.07, 12000:0.047, 18000:0.032, 27500:0.022, 40000:0.015, 60000:0.01"
session_hands = 1000  # Hands in one rated session, it defines the Elo scale.

[game]
table_weights = [11, 14, 14, 14, 14, 14, 14, 5]  # Table size 2..9 probability
stack_min_bb = 1.0
stack_max_bb = 100.0
sb = 50
bb = 100

[training]
iterations = 1000
table_hands = 100       # hands a training table keeps the same players: the opponent statistics fill in over them
concurrent_tables = 8   # tables played in turn, so a batch is not the same few opponents
allin_runouts = 20      # a hand all-in before the river trains on its expected result over this many boards (0: the real chips)
belief_oracle_mode = "mix"     # feature version 5, oracle guiding: how the true cards are given -- mix ((1-s)*range + s*true hand), swap
                               # (the true hand for some opponents), near (with probability s the range kept to the belief_oracle_near combos
                               # nearest the true hand); E8: mix and near ~+5 bb/100 at iteration 40 from scratch, swap nothing.
                               # The share s and how long it lasts are sweep axes: belief_oracle, belief_oracle_iterations in [starting-point]

[styles]
# The unit of each style axis (rl/styles.py), from the calibration studies (studies/agents/style_calibration.py:
# the strength at which an axis's costlier extreme costs what being the #50 instead of the #1 does). Fleet-wide,
# not swept (share, spread, temperature and jitter are in [starting-point]). With only the first five listed, the
# other ten are off.
# The ten axes of detail are at 60% of their own calibration: each was calibrated alone, and fifteen add up -- a
# random style at style_spread 0.75 cost -44 bb/100 at 100%, -14 at 60% (about the #50), -1.5 at 40%, +0.5 with the
# first five alone (paired hands, 40,000 a setting).
style_scales = [
    5.0,   # larghezza: tight <-> loose preflop
    8.0,   # aggressivita_preflop: call <-> raise preflop
    8.0,   # aggressivita_postflop: check/call <-> bet/raise, every street after the flop
    4.0,   # tenacia: gives up <-> calls, facing a bet
    8.0,   # dimensione: small <-> big bets
    12.0,  # posizione: looser and more aggressive the later it acts
    14.0,  # aggressivita_flop: the flop alone (c-bet)
    19.0,  # aggressivita_turn: the turn alone (second barrel)
    12.0,  # aggressivita_river: the river alone
    17.0,  # bluff: bets and raises with nothing
    19.0,  # slowplay: checks and calls a strong hand (negative: fast-plays)
    17.0,  # tre_bet: re-raises a single raise preflop
    14.0,  # fold_al_tre_bet: folds its own raise to a re-raise
    10.0,  # check_raise: raises a bet after checking the street
    19.0,  # shove_corto: shoves instead of raising small with a short stack (25 bb down)
]

[network]
hidden = 512        # width of each trunk's layers (policy and critic have one each, same shape, separate weights)
num_layers = 3       # layers in each trunk
head_hidden = 256    # width of the hidden layers of each head (policy and value)
head_layers = 1      # hidden layers in each head before its output layer (0 = the output layer alone)
critic_bins = 101    # 0: the critic is one value (squared error); N >= 2: a classifier over N
                     # bins (HL-Gauss, uniform in symlog, cross-entropy; 101 is what was measured offline,
                     # on since 2026-11-16). Not a reset: a parent with the other critic passes on everything but the
                     # critic's output layer.
equity_model = "equity_evaluator/distill-lat32_h256_h1.pt"   # required: an equity network (studies/equity_net). The policy
                     # reads its per-player encoder in place of the card planes and the critic, a separate network,
                     # reads every player's equity in place of them. A different file is a fleet reset: models built
                     # on different encoders do not exchange weights.
feature_version = 5  # the encoding new networks read: 3, or 5 (a belief about every opponent's cards in place of the
                     # opponent statistics; needs belief_model). A change is a reset for the lineages: a parent of
                     # another version is not one, so the workers start from scratch until the store holds models of it.
belief_model = "belief_evaluator/belief-memory-v3.pt"   # the belief network (studies/belief) copied into every network of
                     # version 5; trained on equity_model. Read only at version 5.

raise_sizing = "bin"  # how the models size a raise when they play (rated sessions, the pool's opponents, the GUI):
                     # bin, the drawn bin's level; weighted, every open raise bin's level weighted by its probability
                     # (the all-in stays a bin). The learner trains on bins either way.

[opponent-pool]
pool_models = 20
pool_refresh_every = 2   # every this many iterations a run draws its whole opponent pool again from the store as it is now, with pool_top_share and pool_top_n (0: the pool drawn at the start stays all run)

[inheritance]
parent_tiers = "5, 10, 100, all"   # Where a worker's parent comes from.

[starting-point]
lr = 0.0001
hands = 20000                # per iteration 
opponent_probability = 0.8
ppo_epochs = 2
clip_epsilon = 0.2
minibatch_size = 10000
gae_lambda = 0.7
value_coef = 1.0
policy_max_grad_norm = 0.7  # the policy's gradient clip
pool_top_share = 0.8
pool_top_n = 100
# the annealing curves, counted from the start of each worker's own run (0 iterations: no annealing; 0 stays 0 under the sweep)
lr_anneal_iterations = 1000   # the learning rate falls geometrically from the worker's lr to lr_anneal_final over this many iterations, then stays
lr_anneal_final = 0.00003     # the rate at the end of the annealing (absolute value)
entropy_anneal_iterations = 100  # the entropy bonus falls geometrically from start to final over this many iterations, then stays final
entropy_anneal_start = 0.005  # the bonus at a run's first iteration, inherited parent or not
entropy_anneal_final = 0.00001
# the opponents with a random style (0 share: none, and it stays 0 under the sweep)
style_share = 0.5             # share of the opponent seats (pool models) that play with a random style for a table's hands (capped at 1)
style_spread = 0.75           # sd of each style axis (normal around 0, cut at +-1): most styles are mild, few extreme
style_temperature_spread = 0.2  # sd of the log of a style's temperature (cut to a factor of 2 either way)
style_jitter = 0.1            # sd of the noise on the shape of a style's push
belief_oracle = 0.5           # feature version 5: the share of the opponents' true cards given to the learner's beliefs at the start of a run (0 = off)
belief_oracle_iterations = 500  # the iterations over which belief_oracle falls linearly to 0 (0: held all run)

[sweep]
inherit_hyperparameters = true    # true: a worker perturbs its parent's settings (the sweep). false: every worker uses exactly [starting-point], no perturbation, no optimizer
hp_multipliers = [0.8, 1.0, 1.3]
sweep_optimizer = true    # true: steer the multipliers by Elo gained per unit of CPU (uniform until warmed up). false: uniform draw, the estimate is still logged
sweep_explore = 0.35       # chance an axis is drawn uniformly anyway (keeps every effect measurable)
sweep_warmup = 150         # children observed before the optimizer steers
sweep_window = 1500        # most recent children it reads
sweep_min_gain = 1.0       # Elo a unit of relative cost is worth, at least

[validation]
eval_every = 100           # iterations between passes (0 disables)
eval_sessions = 100         # rated sessions per pass, each session_hands long

[benchmark]
benchmark_sessions = 10000   # sessions against the frozen anchors before publishing
snapshot_every = 100        # every this many iterations a worker publishes the model it has then, as a model of its own (label ending -i0100), rated first by snapshot_benchmark_sessions sessions against the anchors; the run goes on. 0: only the final model
snapshot_benchmark_sessions = 1000   # sessions against the anchors that earn a snapshot its published rating (the final model plays benchmark_sessions)
benchmark_resident = 20    # anchors held in memory at once (a random slice of the frozen set)
benchmark_rotate_every = 50  # sessions played against one slice before drawing the next

[population-elo]
global_elo = true
global_sample = 10
global_benchmark_sample = 20
draw_tiers = "10, 100, all"   # Who the passes seat: equal share per tier.
global_sessions = 100

[fill-in]
elo_fill_in = true         
fill_deadline_minutes = 1000
fill_sessions = 10

[pruning]
global_trigger_size = 5000
global_eliminate_fraction = 0.01
global_protect_percentile = 0.0
prune_protect_top = 100    # the pruning keeps the 100 best-rated models whatever they play; below them it removes the
                           # models that play most like another (rl/diversity.py, studies/agents/diversity_study.py)
diversity_probes = "diversity/probes-v2.pkl"   # the decisions a model's play is read on; a new file means new signatures

[anchors]
benchmark_games_percentile = 90.0
benchmark_margin = 30.0

[benchmark-arena]
arena_min_sessions = 10000      # never declare convergence before this many rated sessions
arena_max_sessions = 1000000     # safety cap, not a failure
arena_tolerance = 1.0           # rating points of net drift over the window
arena_window = 10000             # sessions the drift is measured across
arena_checkpoint_sessions = 200  # sessions between two writes of the ratings (and convergence tests)



[poker-elo]
elo_sessions = 2000         # rated sessions poker-elo plays in total

[dashboard]
dashboard_port = 8770
dashboard_refresh = 15     # seconds between polls
