
[fleet]
worker_ceiling = 3
device = "cpu"      # "auto": the GPU if torch sees one, else "cpu"; or "cpu" / "cuda" to force it
update_device = "auto"   # where the PPO update and the critic run: "same" as device; "auto" = the GPU if the machine has one, else as device; or "cpu" / "cuda". The hands are always played on device
collect_workers = 30  # forked copies of each worker that play its iteration's hands at the same time (~120 MB each while they run); 1 = none. cpu only
session_workers = 30   # the same for the sessions of a rated pass: the validation, the pass against the anchors, the Elo passes. cpu only

[elo]
k_schedule = "0:16, 20:11, 45:7.4, 80:5, 140:3.4, 225:2.3, 325:1.6, 500:1.05, 750:0.72, 1200:0.49, 1700:0.33, 2500:0.22, 3750:0.15, 5500:0.1, 8500:0.07, 12000:0.047, 18000:0.032, 27500:0.022, 40000:0.015, 60000:0.01"
session_hands = 1000  # Hands in one rated session, it defines the Elo scale.

[game]
table_weights = [11, 14, 14, 14, 14, 14, 14, 5]  # Table size 2..9 probability
stack_min_bb = 1.0
stack_max_bb = 100.0
sb = 50
bb = 100

[training]
iterations = 2000
table_hands = 100       # hands a training table keeps the same players: the opponent statistics fill in over them
concurrent_tables = 8   # tables played in turn, so a batch is not the same few opponents
allin_runouts = 20      # a hand all-in before the river trains on its expected result over this many boards (0: the real chips)
critic_stack_power = 1.4  # the critic's loss weighs a decision by (chips at stake in bb)^-1.4: the target's sd grows ~stake^0.7 (0: off)

lr_anneal_iterations = 2000   # every worker's learning rate falls geometrically from its own lr (swept/inherited, [starting-point]) to lr_anneal_final over its run's first 500 iterations, then stays (0: constant lr)
lr_anneal_final = 0.00001  # the rate at the end of the annealing (absolute value, the same for every worker)
entropy_anneal_iterations = 200  # every worker's entropy bonus falls geometrically over its run's first 500 iterations, then stays final (0: no annealing, the bonus is entropy_anneal_final throughout)
entropy_anneal_start = 0.03       # the bonus at the first iteration of every run, inherited parent or not
entropy_anneal_final = 0.00001    

[styles]
style_share = 0.1   # share of the opponent seats (pool models) that play with a random style for a table's hands; 0 = off
style_spread = 0.75               # sd of each style axis (normal around 0, cut at +-1): most styles are mild, few extreme
style_temperature_spread = 0.2   # sd of the log of a style's temperature (cut to a factor of 2 either way)
style_jitter = 0.1               # sd of the noise on the shape of a style's push
style_scales = [10.0, 16.0, 16.0, 8.0, 10.0]

[network]
hidden = 512        # width of each trunk's layers (policy and critic have one each, same shape, separate weights)
num_layers = 3       # layers in each trunk
head_hidden = 256    # width of the hidden layers of each head (policy and value)
head_layers = 1      # hidden layers in each head before its output layer (0 = the output layer alone)
equity_model = "equity_evaluator/distill-lat32_h256_h1.pt"   # required: an equity network (studies/equity_net). The policy
                     # reads its per-player encoder in place of the card planes and the critic, a separate network,
                     # reads every player's equity in place of them. A different file is a fleet reset: models built
                     # on different encoders do not exchange weights.

[opponent-pool]
pool_models = 20
pool_refresh_every = 10   # every this many iterations a run draws its whole opponent pool again from the store as it is now, with pool_top_share and pool_top_n (0: the pool drawn at the start stays all run)

[inheritance]
parent_tiers = "5, 10, 100, all"   # Where a worker's parent comes from.

[starting-point]
lr = 0.0003
hands = 20000                # per iteration 
opponent_probability = 0.5
ppo_epochs = 5
clip_epsilon = 0.2
minibatch_size = 10000
gae_lambda = 0.7
value_coef = 1.0
policy_max_grad_norm = 0.7  # the policy's gradient clip
critic_max_grad_norm = 0.5   # the critic's gradient clip: its own, the two networks share no weight
pool_top_share = 0.8
pool_top_n = 100

[sweep]
inherit_hyperparameters = false    # true: a worker perturbs its parent's settings (the sweep). false: every worker uses exactly [starting-point], no perturbation, no optimizer
hp_multipliers = [0.8, 1.0, 1.3]
sweep_optimizer = false    # true: steer the multipliers by Elo gained per unit of CPU (uniform until warmed up). false: uniform draw, the estimate is still logged
sweep_explore = 0.35       # chance an axis is drawn uniformly anyway (keeps every effect measurable)
sweep_warmup = 150         # children observed before the optimizer steers
sweep_window = 1500        # most recent children it reads
sweep_min_gain = 1.0       # Elo a unit of relative cost is worth, at least

[validation]
eval_every = 100           # iterations between passes (0 disables)
eval_sessions = 100         # rated sessions per pass, each session_hands long

[benchmark]
benchmark_sessions = 10000   # sessions against the frozen anchors before publishing
snapshot_every = 100        # every this many iterations a worker publishes the model it has then, as a model of its own (label ending -i0100), rated first by snapshot_benchmark_sessions sessions against the anchors; the run goes on. 0: only the final model
snapshot_benchmark_sessions = 1000   # sessions against the anchors that earn a snapshot its published rating (the final model plays benchmark_sessions)
benchmark_resident = 20    # anchors held in memory at once (a random slice of the frozen set)
benchmark_rotate_every = 50  # sessions played against one slice before drawing the next

[population-elo]
global_elo = true
global_sample = 20
global_benchmark_sample = 5
draw_tiers = "10, 100, all"   # Who the passes seat: equal share per tier.
global_sessions = 100

[fill-in]
elo_fill_in = true         
fill_deadline_minutes = 1000
fill_sessions = 10

[pruning]
global_trigger_size = 500
global_eliminate_fraction = 0.05
global_protect_percentile = 0.0

[anchors]
benchmark_games_percentile = 95.0
benchmark_margin = 50.0

[benchmark-arena]
arena_min_sessions = 10000      # never declare convergence before this many rated sessions
arena_max_sessions = 100000     # safety cap, not a failure
arena_tolerance = 1.0           # rating points of net drift over the window
arena_window = 4000             # sessions the drift is measured across
arena_checkpoint_sessions = 200  # sessions between two writes of the ratings (and convergence tests)



[poker-elo]
elo_sessions = 2000         # rated sessions poker-elo plays in total

[dashboard]
dashboard_port = 8770
dashboard_refresh = 15     # seconds between polls
